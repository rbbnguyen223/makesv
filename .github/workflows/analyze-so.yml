name: Analyze libApplicationMain.so
on:
  push:
    paths:
      - libApplicationMain.so
      - .github/workflows/analyze-so.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabi
          SO=libApplicationMain.so
          echo '=== FILE ==='
          ls -l "$SO"
          file "$SO"
          readelf -h "$SO"
          echo '=== KEY STRINGS ==='
          strings -a -t x "$SO" | grep -Ei 'register|loginGame|CreateCharacter|GameStateNewbie|character|heroId|hasRole|isNew|roleName|newbie|gateway|socket|session|enter.?game|game.?data|error' | head -n 1000
          echo '=== DISASM KNOWN FUNCTIONS ==='
          arm-linux-gnueabi-objdump -D -m arm --adjust-vma=0x10000 "$SO" > /tmp/dis.txt
          for r in '7c2af4 7c2df0' 'd0b504 d0b850' 'd1f834 d1fb80'; do
            set -- $r
            echo "--- $1..$2 ---"
            sed -n "/^[[:space:]]*0x\?$1:/,/^[[:space:]]*0x\?$2:/p" /tmp/dis.txt | head -n 700
          done
