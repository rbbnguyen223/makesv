name: Analyze libApplicationMain.so
on:
  push:
    paths:
      - libApplicationMain.so
      - rebuild.py
      - .github/workflows/analyze-so.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabi
      - run: |
          echo "=== SYMBOLS ==="
          arm-linux-gnueabi-nm -a -C libApplicationMain.so 2>/dev/null | grep -Ei 'LoginHandler|FBClientSocket|GameStateNewbie|CreateCharacter|LoginGame|RequestCharacter|FinishRegister|SendRegister' | head -n 500 || true
          echo "=== STRINGS ==="
          strings -a -t x libApplicationMain.so | grep -Ei 'register|loginGame|loginGameMapping|loginSessionRequest|loginSessionNewRequest|list_character|FinishRegister|heroId|isNew|error_code|SESSION_ID|connectSession|setSession'
          echo "=== SECTIONS ==="
          readelf -S libApplicationMain.so
